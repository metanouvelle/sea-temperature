<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>{{ name }} sea temperature — SwimTemp</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;background:transparent;color:#10233b;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .w{margin:4px;border:1px solid #dce3e9;border-radius:12px;background:#fff;padding:16px;min-height:244px;display:flex;flex-direction:column}
    .top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
    .name{font-size:16px;font-weight:750;letter-spacing:-.02em;line-height:1.2}
    .brand{font-size:11px;color:#718094;text-decoration:none}
    .temp{margin-top:24px;display:flex;align-items:baseline;gap:3px;font-size:54px;font-weight:800;letter-spacing:-.055em;line-height:.9;font-variant-numeric:tabular-nums}
    .temp small{font-size:17px;color:#718094;letter-spacing:0}
    .status{margin-top:10px;font-size:13px;font-weight:650}
    .observed{margin-top:8px;font-size:11px;color:#718094}
    .conditions{margin-top:auto;padding-top:16px;border-top:1px solid #edf1f5;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
    .conditions span{display:block;color:#718094;font-size:9px;text-transform:uppercase;letter-spacing:.08em}
    .conditions strong{display:block;margin-top:3px;font-size:14px;font-variant-numeric:tabular-nums}
    .muted{color:#718094}
  </style>
</head>
<body>
  <div class="w">
    <div class="top">
      <div class="name">{{ name }}</div>
      <a class="brand" href="https://swimtemp.com" target="_blank" rel="noopener">SwimTemp</a>
    </div>
    <div class="temp" id="temp"><span class="muted">—</span><small>°C</small></div>
    <div class="status" id="status">Loading latest reading…</div>
    <div class="observed" id="observed"></div>
    <div class="conditions">
      <div><span>Waves</span><strong id="wave">—</strong></div>
      <div><span>Swell</span><strong id="swell">—</strong></div>
      <div><span>Current</span><strong id="current">—</strong></div>
    </div>
  </div>
<script>
const lat={{ lat }}, lon={{ lon }};
function comfort(t){
  if(t<16) return 'Cold water';
  if(t<20) return 'Cool for swimming';
  if(t<25) return 'Comfortable for most swimmers';
  return 'Warm water';
}
function shortDate(value){
  if(!value) return '';
  const d=new Date(value.length===10 ? value+'T00:00:00Z' : value);
  return Number.isNaN(d.valueOf()) ? value : new Intl.DateTimeFormat('en',{month:'short',day:'numeric',timeZone:'UTC'}).format(d);
}
async function load(){
  try{
    const r=await fetch(`/api/point?lat=${lat}&lon=${lon}`);
    if(!r.ok) throw new Error();
    const d=await r.json();
    const t=Number(d.temp_c ?? d.temperature ?? d.sst);
    if(Number.isFinite(t)){
      document.getElementById('temp').innerHTML=`${t.toFixed(1)}<small>°C</small>`;
      document.getElementById('status').textContent=comfort(t);
    } else {
      document.getElementById('status').textContent='Current temperature unavailable';
    }
    const date=d.date || d.observation_date || d.latest_date;
    if(date) document.getElementById('observed').textContent=`Observed ${shortDate(date)}`;
  }catch{
    document.getElementById('status').textContent='Current temperature unavailable';
  }
  try{
    const u=`https://marine-api.open-meteo.com/v1/marine?latitude=${lat}&longitude=${lon}&current=wave_height,swell_wave_height,ocean_current_velocity`;
    const r=await fetch(u); if(!r.ok) throw new Error();
    const d=await r.json(), c=d.current || {};
    const set=(id,v,unit)=>document.getElementById(id).textContent=Number.isFinite(Number(v))?`${Number(v).toFixed(unit==='km/h'?2:1)} ${unit}`:'—';
    set('wave',c.wave_height,'m');
    set('swell',c.swell_wave_height,'m');
    set('current',c.ocean_current_velocity,'km/h');
  }catch{}
}
load();
</script>
</body>
</html>

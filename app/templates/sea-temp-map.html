<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>Sea Temperature</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500&family=Cormorant+Garamond:wght@300;400;600&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
    <style>
        :root {
            --navy: #0d1b2a;
            --glass: rgba(255, 255, 255, 0.92);
            --muted: #64748b;
            --soft: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'DM Mono', monospace;
            background: var(--navy);
            overflow: hidden;
        }

        #map {
            position: fixed;
            inset: 0;
        }

        .panel {
            position: fixed;
            z-index: 10;
            background: var(--glass);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 1px 0 rgba(255, 255, 255, 0.8) inset, 0 4px 6px rgba(0, 0, 0, 0.04), 0 20px 50px rgba(0, 0, 0, 0.12);
        }

        /* ── Info panel ── */
        #info-panel {
            top: 24px;
            left: 24px;
            width: 272px;
            overflow: hidden;
        }

        #info-color-bar {
            height: 3px;
            display: none;
            transition: background 0.5s;
            border-radius: 20px 20px 0 0;
        }

        #info-content {
            padding: 22px 24px 22px;
        }

        .panel-eyebrow {
            font-size: 9px;
            font-weight: 500;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--soft);
            margin-bottom: 5px;
        }

        .panel-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 21px;
            font-weight: 600;
            color: var(--navy);
            letter-spacing: -0.3px;
            line-height: 1.1;
        }

        .info-placeholder {
            font-size: 11px;
            color: var(--muted);
            line-height: 1.9;
            margin-top: 12px;
            letter-spacing: 0.2px;
        }

        .temp-place {
            font-size: 10px;
            color: var(--soft);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-top: 16px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .temp-display {
            display: flex;
            align-items: baseline;
            gap: 3px;
            margin: 4px 0 10px;
        }

        .temp-value {
            font-family: 'Cormorant Garamond', serif;
            font-size: 70px;
            font-weight: 300;
            letter-spacing: -5px;
            line-height: 1;
            color: var(--navy);
        }

        .temp-unit {
            font-size: 15px;
            font-weight: 300;
            color: var(--soft);
            margin-bottom: 6px;
        }

        .temp-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 13px 4px 9px;
            border-radius: 100px;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .temp-meta {
            font-size: 10px;
            color: var(--soft);
            letter-spacing: 0.8px;
            line-height: 2;
            border-top: 1px solid rgba(0, 0, 0, 0.06);
            padding-top: 10px;
            margin-top: 10px;
            text-transform: uppercase;
        }

        .spinner {
            width: 18px;
            height: 18px;
            margin: 18px 0 4px;
            border: 2px solid rgba(0, 0, 0, 0.08);
            border-top-color: #0ea5e9;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ── Legend panel ── */
        #legend-panel {
            top: 24px;
            right: 24px;
            width: 212px;
            padding: 20px 18px 16px;
        }

        .legend-eyebrow {
            font-size: 9px;
            font-weight: 500;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--soft);
            margin-bottom: 14px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 8px 10px;
            border-radius: 10px;
            margin: 2px 0;
        }

        .legend-swatch {
            width: 26px;
            height: 6px;
            border-radius: 3px;
            flex-shrink: 0;
        }

        .legend-name {
            font-size: 12px;
            font-weight: 500;
            color: #1e293b;
            flex: 1;
        }

        .legend-range {
            font-size: 10px;
            color: var(--soft);
        }

        .maplibregl-ctrl-attrib {
            background: rgba(255, 255, 255, 0.75) !important;
            font-size: 9px !important;
        }

        .maplibregl-ctrl-bottom-right {
            bottom: 8px;
            right: 8px;
        }
    </style>
</head>

<body>

    <div id="map"></div>

    <div class="panel" id="info-panel">
        <div id="info-color-bar"></div>
        <div id="info-content">
            <div class="panel-eyebrow">Ocean conditions</div>
            <div class="panel-title">Sea Temperature</div>
            <div id="info-body">
                <div class="info-placeholder">Click anywhere on the ocean to check the water temperature.</div>
            </div>
        </div>
    </div>

    <div class="panel" id="legend-panel">
        <div class="legend-eyebrow">Water temperature</div>
        <div id="legend-items"></div>
    </div>

    <script>
        const BANDS = [
            { id: 'cold', label: 'Cold', range: '< 17°C', color: '#2563eb', emoji: '🥶', min: -99, max: 17 },
            { id: 'brave', label: 'Brave', range: '17–20°C', color: '#0ea5e9', emoji: '🤿', min: 17, max: 20 },
            { id: 'nice', label: 'Nice', range: '20–23°C', color: '#22c55e', emoji: '😊', min: 20, max: 23 },
            { id: 'perfect', label: 'Perfect', range: '23–26°C', color: '#f59e0b', emoji: '🏊', min: 23, max: 26 },
            { id: 'very_warm', label: 'Very Warm', range: '> 26°C', color: '#ef4444', emoji: '🔥', min: 26, max: 999 },
        ];

        function getBand(t) {
            return BANDS.find(b => t >= b.min && t < b.max) || BANDS[BANDS.length - 1];
        }

        // ── Reverse geocoding (Nominatim) ─────────────────────────────────────────────
        async function getPlaceName(lat, lon) {
            try {
                const res = await fetch(
                    `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json&zoom=8`,
                    { headers: { 'Accept-Language': 'en' } }
                );
                if (!res.ok) return null;
                const d = await res.json();
                const a = d.address || {};
                if (a.sea) return a.sea;
                if (a.ocean) return a.ocean;
                const place = a.city || a.town || a.village || a.county || a.state || '';
                const country = a.country || '';
                if (place && country) return `${place}, ${country}`;
                if (country) return country;
                return null;
            } catch { return null; }
        }

        // ── Map ───────────────────────────────────────────────────────────────────────
        const map = new maplibregl.Map({
            container: 'map',
            style: 'https://tiles.openfreemap.org/styles/liberty',
            center: [14, 36], zoom: 5.5, minZoom: 3, maxZoom: 18,
            attributionControl: false,
        });

        map.addControl(new maplibregl.AttributionControl({ compact: true }), 'bottom-right');
        map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'bottom-right');

        map.on('error', e => console.error('MapLibre error:', e.error));

        map.on('load', () => {
            console.log('Map loaded OK');
        });

        // ── Legend — static color key ─────────────────────────────────────────────────
        BANDS.forEach(band => {
            const item = document.createElement('div');
            item.className = 'legend-item';
            item.innerHTML = `
        <div class="legend-swatch" style="background:${band.color};box-shadow:0 2px 6px ${band.color}44"></div>
        <span class="legend-name">${band.label}</span>
        <span class="legend-range">${band.range}</span>
    `;
            document.getElementById('legend-items').appendChild(item);
        });

        // ── Click to inspect temperature ──────────────────────────────────────────────
        let marker = null;

        map.on('click', async e => {
            if (e.originalEvent.target.closest('.panel')) return;

            const { lng: lon, lat } = e.lngLat;

            if (marker) marker.remove();
            const el = document.createElement('div');
            el.style.cssText = `
        width:14px;height:14px;border-radius:50%;
        background:#fff;border:3px solid #0ea5e9;
        box-shadow:0 2px 8px rgba(0,0,0,0.3);transition:border-color 0.4s;
    `;
            marker = new maplibregl.Marker({ element: el, anchor: 'center' }).setLngLat([lon, lat]).addTo(map);

            document.getElementById('info-body').innerHTML = `<div class="spinner"></div>`;

            const [tempResult, placeName] = await Promise.all([
                fetch(`/api/point?lat=${lat.toFixed(5)}&lon=${lon.toFixed(5)}&radius_km=10`)
                    .then(r => r.ok ? r.json() : null)
                    .catch(() => null),
                getPlaceName(lat, lon),
            ]);

            if (!tempResult || tempResult.status !== 'ok') {
                document.getElementById('info-body').innerHTML =
                    `<div class="info-placeholder">No ocean data here. Try clicking open water.</div>`;
                return;
            }

            const band = getBand(tempResult.mean_c);
            el.style.borderColor = band.color;

            const bar = document.getElementById('info-color-bar');
            bar.style.display = 'block';
            bar.style.background = `linear-gradient(90deg, ${band.color}, ${band.color}99)`;

            document.getElementById('info-body').innerHTML = `
        <div class="temp-place">${placeName || 'Open Ocean'}</div>
        <div class="temp-display">
            <span class="temp-value">${tempResult.mean_c.toFixed(1)}</span>
            <span class="temp-unit">°C</span>
        </div>
        <div class="temp-badge" style="background:${band.color}18;color:${band.color};border:1.5px solid ${band.color}33">
            <span>${band.emoji}</span>
            <span>${band.label}</span>
        </div>
        <div class="temp-meta">
            ${tempResult.date}
        </div>
    `;
        });
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Ocean Temperature Map — SwimTemp</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500&family=Cormorant+Garamond:wght@300;400;600&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
    <style>
        :root {
            --navy: #0d1b2a;
            --glass: rgba(255, 255, 255, 0.95);
            --muted: #475569;
            --soft: #64748b;
            --accent: #38bdf8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'DM Mono', monospace;
            background: var(--navy);
            overflow: hidden;
        }

        #map {
            position: fixed;
            inset: 0;
        }

        /* ── Top nav ── */
        #map-nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px;
            pointer-events: none;
        }

        .nav-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(13, 27, 42, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 100px;
            padding: 8px 18px;
            color: rgba(255, 255, 255, 0.85);
            text-decoration: none;
            font-size: 12px;
            letter-spacing: 0.5px;
            pointer-events: all;
            transition: all 0.2s;
        }

        .nav-pill:hover {
            background: rgba(13, 27, 42, 0.95);
            border-color: rgba(255, 255, 255, 0.25);
            color: #fff;
        }

        .nav-pill-brand {
            font-family: 'Cormorant Garamond', serif;
            font-size: 15px;
            font-weight: 600;
        }

        .nav-pill-link {
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.6);
        }

        /* ── Panels ── */
        .panel {
            position: fixed;
            z-index: 10;
            background: var(--glass);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow:
                0 1px 0 rgba(255, 255, 255, 0.8) inset,
                0 4px 6px rgba(0, 0, 0, 0.04),
                0 20px 50px rgba(0, 0, 0, 0.12);
        }

        /* ── Info panel ── */
        #info-panel {
            top: 72px;
            left: 20px;
            width: 272px;
            overflow: hidden;
        }

        #info-color-bar {
            height: 3px;
            display: none;
            transition: background 0.5s;
            border-radius: 20px 20px 0 0;
        }

        #info-content {
            padding: 20px 22px 20px;
        }

        .panel-eyebrow {
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--soft);
            margin-bottom: 4px;
        }

        .panel-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 20px;
            font-weight: 600;
            color: var(--navy);
            letter-spacing: -0.3px;
            line-height: 1.1;
        }

        .info-placeholder {
            font-size: 12px;
            color: var(--muted);
            line-height: 1.9;
            margin-top: 12px;
            letter-spacing: 0.2px;
        }

        .temp-place {
            font-size: 11px;
            color: var(--soft);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-top: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .temp-display {
            display: flex;
            align-items: baseline;
            gap: 3px;
            margin: 4px 0 10px;
        }

        .temp-value {
            font-family: 'Cormorant Garamond', serif;
            font-size: 68px;
            font-weight: 300;
            letter-spacing: -5px;
            line-height: 1;
            color: var(--navy);
        }

        .temp-unit {
            font-size: 15px;
            font-weight: 300;
            color: var(--soft);
            margin-bottom: 6px;
        }

        .temp-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 13px 4px 9px;
            border-radius: 100px;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .temp-meta {
            font-size: 11px;
            color: var(--soft);
            letter-spacing: 0.8px;
            line-height: 2;
            border-top: 1px solid rgba(0, 0, 0, 0.06);
            padding-top: 10px;
            margin-top: 10px;
            text-transform: uppercase;
        }

        .spinner {
            width: 18px;
            height: 18px;
            margin: 18px 0 4px;
            border: 2px solid rgba(0, 0, 0, 0.08);
            border-top-color: #0ea5e9;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ── Legend panel ── */
        #legend-panel {
            top: 72px;
            right: 20px;
            width: 200px;
            padding: 18px 16px 14px;
        }

        .legend-eyebrow {
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--soft);
            margin-bottom: 12px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 8px;
            border-radius: 8px;
            margin: 2px 0;
        }

        .legend-swatch {
            width: 24px;
            height: 6px;
            border-radius: 3px;
            flex-shrink: 0;
        }

        .legend-name {
            font-size: 11px;
            font-weight: 500;
            color: #1e293b;
            flex: 1;
        }

        .legend-range {
            font-size: 10px;
            color: var(--soft);
        }

        /* ── Mobile: stack panels at bottom ── */
        @media (max-width: 640px) {
            #map-nav {
                padding: 10px 14px;
            }

            #info-panel {
                top: auto;
                bottom: 0;
                left: 0;
                right: 0;
                width: 100%;
                border-radius: 20px 20px 0 0;
                max-height: 45vh;
                overflow-y: auto;
            }

            #legend-panel {
                top: 62px;
                right: 10px;
                width: 160px;
                padding: 12px 12px 10px;
            }

            .legend-name {
                font-size: 10px;
            }

            .legend-range {
                font-size: 9px;
            }

            .legend-eyebrow {
                font-size: 9px;
                margin-bottom: 8px;
            }

            .temp-value {
                font-size: 56px;
            }
        }

        /* ── MapLibre overrides ── */
        .maplibregl-ctrl-attrib {
            background: rgba(255, 255, 255, 0.75) !important;
            font-size: 10px !important;
        }

        .maplibregl-ctrl-bottom-right {
            bottom: 8px;
            right: 8px;
        }

        @media (max-width: 640px) {
            .maplibregl-ctrl-bottom-right {
                bottom: 48vh;
            }
        }

        /* ── Accessibility ── */
        .skip-link {
            position: fixed;
            top: -100%;
            left: 1rem;
            z-index: 1000;
            padding: 8px 16px;
            background: var(--accent);
            color: #060f1a;
            font-size: 13px;
            font-weight: 500;
            border-radius: 0 0 8px 8px;
            text-decoration: none;
            transition: top 0.2s;
        }

        .skip-link:focus {
            top: 0;
        }

        :focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
            border-radius: 4px;
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        @media (max-width: 768px) {
            #info-panel {
                top: 12px;
                left: 12px;
                right: 12px;
                width: auto;
            }

            #legend-panel {
                top: auto;
                bottom: 80px;
                left: 12px;
                right: 12px;
                width: auto;
                padding: 12px 16px;
            }

            .legend-eyebrow {
                margin-bottom: 8px;
            }

            #legend-items {
                display: flex;
                flex-direction: row;
                gap: 4px;
                flex-wrap: wrap;
            }

            .legend-item {
                padding: 4px 8px;
                flex: 1;
                min-width: 80px;
            }

            .legend-range {
                display: none;
            }

            .temp-value {
                font-size: 52px;
            }
        }
    </style>
</head>

<body>
    <a href="#info-panel" class="skip-link">Skip to temperature panel</a>

    <div id="map" role="application"
        aria-label="Interactive ocean temperature map. Click on open water to check sea temperature."></div>

    <!-- Top navigation -->
    <nav id="map-nav" aria-label="Site navigation">
        <a href="/" class="nav-pill nav-pill-brand"><span aria-hidden="true">←</span> SwimTemp</a>
        <a href="/beaches" class="nav-pill nav-pill-link">Beaches</a>
    </nav>

    <!-- Info panel -->
    <section class="panel" id="info-panel" aria-label="Temperature information">
        <div id="info-color-bar" aria-hidden="true"></div>
        <div id="info-content">
            <div class="panel-eyebrow">Ocean conditions</div>
            <div class="panel-title">Sea Temperature</div>
            <div id="info-body" aria-live="polite" aria-atomic="true">
                <p class="info-placeholder">Click anywhere on the ocean to check the water temperature.</p>
            </div>
        </div>
    </section>

    <!-- Legend panel -->
    <section class="panel" id="legend-panel" aria-label="Temperature scale legend">
        <div class="legend-eyebrow">Water temperature</div>
        <div id="legend-items"></div>
    </section>

    <script>
        const BANDS = [
            { id: 'cold', label: 'Cold', range: '< 17°C', color: '#2563eb', emoji: '🥶', min: -99, max: 17 },
            { id: 'brave', label: 'Brave', range: '17–20°C', color: '#0ea5e9', emoji: '🤿', min: 17, max: 20 },
            { id: 'nice', label: 'Nice', range: '20–23°C', color: '#22c55e', emoji: '😊', min: 20, max: 23 },
            { id: 'perfect', label: 'Perfect', range: '23–26°C', color: '#f59e0b', emoji: '🏊', min: 23, max: 26 },
            { id: 'very_warm', label: 'Very Warm', range: '> 26°C', color: '#ef4444', emoji: '🔥', min: 26, max: 999 },
        ];

        function getBand(t) {
            return BANDS.find(b => t >= b.min && t < b.max) || BANDS[BANDS.length - 1];
        }

        // ── Reverse geocoding ─────────────────────────────────────────────────────────
        async function getPlaceName(lat, lon) {
            try {
                const res = await fetch(
                    `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json&zoom=8`,
                    { headers: { 'Accept-Language': 'en' } }
                );
                if (!res.ok) return null;
                const d = await res.json();
                const a = d.address || {};
                if (a.sea) return a.sea;
                if (a.ocean) return a.ocean;
                const place = a.city || a.town || a.village || a.county || a.state || '';
                const country = a.country || '';
                if (place && country) return `${place}, ${country}`;
                if (country) return country;
                return null;
            } catch { return null; }
        }

        // ── Map ───────────────────────────────────────────────────────────────────────
        const map = new maplibregl.Map({
            container: 'map',
            style: 'https://tiles.openfreemap.org/styles/liberty',
            center: [14, 36], zoom: 5.5, minZoom: 3, maxZoom: 18,
            attributionControl: false,
        });

        map.addControl(new maplibregl.AttributionControl({ compact: true }), 'bottom-right');
        map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'bottom-right');

        map.on('error', e => console.error('MapLibre error:', e.error));
        map.on('load', () => console.log('Map loaded OK'));

        // ── Legend ────────────────────────────────────────────────────────────────────
        BANDS.forEach(band => {
            const item = document.createElement('div');
            item.className = 'legend-item';
            item.innerHTML = `
        <div class="legend-swatch" style="background:${band.color};box-shadow:0 2px 6px ${band.color}44" aria-hidden="true"></div>
        <span class="legend-name">${band.label}</span>
        <span class="legend-range">${band.range}</span>
    `;
            document.getElementById('legend-items').appendChild(item);
        });

        // ── Click to inspect temperature ──────────────────────────────────────────────
        let marker = null;

        map.on('click', async e => {
            if (e.originalEvent.target.closest('.panel') || e.originalEvent.target.closest('#map-nav')) return;

            const { lng: lon, lat } = e.lngLat;

            if (marker) marker.remove();
            const el = document.createElement('div');
            el.style.cssText = `
        width:14px;height:14px;border-radius:50%;
        background:#fff;border:3px solid #0ea5e9;
        box-shadow:0 2px 8px rgba(0,0,0,0.3);transition:border-color 0.4s;
    `;
            marker = new maplibregl.Marker({ element: el, anchor: 'center' }).setLngLat([lon, lat]).addTo(map);

            document.getElementById('info-body').innerHTML = `<div class="spinner" role="status" aria-label="Loading temperature data"></div>`;

            // Timeout after 10 seconds
            let timedOut = false;
            const timeoutId = setTimeout(() => {
                timedOut = true;
                document.getElementById('info-body').innerHTML =
                    `<p class="info-placeholder">No ocean data for this area. Try clicking closer to a coastline.</p>`;
                if (marker) marker.remove();
            }, 10000);

            const [tempResult, placeName] = await Promise.all([
                fetch(`/api/point?lat=${lat.toFixed(5)}&lon=${lon.toFixed(5)}&radius_km=10`)
                    .then(r => r.ok ? r.json() : null)
                    .catch(() => null),
                getPlaceName(lat, lon),
            ]);

            clearTimeout(timeoutId);
            if (timedOut) return;

            if (!tempResult || tempResult.status !== 'ok') {
                document.getElementById('info-body').innerHTML =
                    `<p class="info-placeholder">No ocean data here. Try clicking open water.</p>`;
                return;
            }

            const band = getBand(tempResult.mean_c);
            el.style.borderColor = band.color;

            const bar = document.getElementById('info-color-bar');
            bar.style.display = 'block';
            bar.style.background = `linear-gradient(90deg, ${band.color}, ${band.color}99)`;

            document.getElementById('info-body').innerHTML = `
        <p class="temp-place">${placeName || 'Open Ocean'}</p>
        <div class="temp-display">
            <span class="temp-value">${tempResult.mean_c.toFixed(1)}</span>
            <span class="temp-unit">°C</span>
        </div>
        <div class="temp-badge" style="background:${band.color}18;color:${band.color};border:1.5px solid ${band.color}33">
            <span aria-hidden="true">${band.emoji}</span>
            <span>${band.label}</span>
        </div>
        <p class="temp-meta">${tempResult.date}</p>
    `;
        });
    </script>
</body>

</html>

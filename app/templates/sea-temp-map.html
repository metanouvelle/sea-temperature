<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Ocean Temperature Map — SwimTemp</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;0,9..144,700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/static/shared-tokens.css">
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
    <style>
        :root {
            /* Core palette */
            --navy: #0d1b2a;
            --navy-hover: #162638;
            --bg: #060f1a;
            --glass: rgba(255, 255, 255, 0.95);
            --soft: #334155;
            --muted: #475569;
            --accent: #38bdf8;
            --link: #0369a1;

            /* White on dark — 3 levels only */
            --on-dark: rgba(255, 255, 255, 0.90);
            --on-dark-2: rgba(255, 255, 255, 0.55);
            --on-dark-3: rgba(255, 255, 255, 0.30);

            /* Navy transparency — 3 levels only */
            --navy-90: rgba(13, 27, 42, 0.90);
            --navy-95: rgba(13, 27, 42, 0.95);
            --navy-98: rgba(13, 27, 42, 0.98);

            /* Border on dark */
            --border-dark: rgba(255, 255, 255, 0.08);
            --border-dark-2: rgba(255, 255, 255, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'DM Mono', monospace;
            background: var(--navy);
            overflow: hidden;
        }

        #map {
            position: fixed;
            inset: 0;
        }

        /* ── Top nav ── */
        #map-nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px;
            pointer-events: none;
        }

        .nav-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 100px;
            padding: 8px 18px;
            color: var(--navy);
            text-decoration: none;
            font-size: 12px;
            letter-spacing: 0.5px;
            pointer-events: all;
            transition: all 0.2s;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.12);
        }

        .nav-pill:hover {
            background: #ffffff;
            border-color: rgba(0, 0, 0, 0.14);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.16);
        }

        .nav-pill-brand {
            font-family: 'Fraunces', serif;
            font-size: 15px;
            font-weight: 600;
            color: var(--navy);
        }

        .nav-pill-link {
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-panel-soft);
        }

        .nav-pill-link:hover {
            color: var(--navy);
        }

        /* ── Search bar ── */
        #search-container {
            position: fixed;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            width: 480px;
            pointer-events: all;
        }

        #search-wrap {
            position: relative;
        }

        #search-input {
            width: 100%;
            padding: 11px 44px 11px 18px;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 100px;
            color: var(--navy);
            font-family: 'DM Mono', monospace;
            font-size: 13px;
            letter-spacing: 0.3px;
            outline: none;
            transition: all 0.2s;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.12);
        }

        #search-input::placeholder {
            color: var(--text-panel-muted);
        }

        #search-input:focus {
            border-color: var(--accent);
            background: #ffffff;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.16), 0 0 0 3px rgba(56, 189, 248, 0.15);
        }

        #search-icon {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-panel-muted);
            pointer-events: none;
            font-size: 15px;
        }

        #search-results {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 16px;
            overflow: hidden;
            display: none;
            max-height: 260px;
            overflow-y: auto;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.16);
        }

        #search-results.visible {
            display: block;
        }

        .search-result-item {
            padding: 12px 18px;
            cursor: pointer;
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
            transition: background 0.15s;
        }

        .search-result-item:last-child {
            border-bottom: none;
        }

        .search-result-item:hover {
            background: rgba(56, 189, 248, 0.06);
        }

        .search-result-name {
            font-size: 13px;
            color: var(--navy);
            letter-spacing: 0.2px;
            margin-bottom: 2px;
            font-weight: 500;
        }

        .search-result-type {
            font-size: 10px;
            color: var(--text-panel-muted);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .search-loading {
            padding: 16px;
            text-align: center;
            font-size: 11px;
            color: var(--text-panel-muted);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* ── Panels ── */
        .panel {
            position: fixed;
            z-index: 10;
            background: var(--glass);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow:
                0 1px 0 rgba(255, 255, 255, 0.8) inset,
                0 4px 6px rgba(0, 0, 0, 0.04),
                0 20px 50px rgba(0, 0, 0, 0.12);
        }

        /* ── Info panel ── */
        #info-panel {
            top: 72px;
            left: 20px;
            width: 360px;
            overflow: hidden;
            overflow-x: hidden;
            transition: width 0.25s ease;
        }

        #info-panel.wide {
            width: 520px;
        }

        #info-color-bar {
            height: 3px;
            display: none;
            transition: background 0.5s;
            border-radius: 20px 20px 0 0;
        }

        #info-content {
            padding: 20px 22px;
        }

        .panel-eyebrow {
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--soft);
            margin-bottom: 4px;
        }

        .panel-title {
            font-family: 'Fraunces', serif;
            font-size: 20px;
            font-weight: 600;
            color: var(--navy);
            letter-spacing: -0.3px;
            line-height: 1.1;
        }

        .info-placeholder {
            font-size: 12px;
            color: var(--muted);
            line-height: 1.9;
            margin-top: 12px;
            letter-spacing: 0.2px;
        }

        .temp-place {
            font-size: 11px;
            color: var(--soft);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-top: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .temp-display {
            display: flex;
            align-items: baseline;
            gap: 3px;
            margin: 4px 0 10px;
        }

        .temp-value {
            font-family: 'Fraunces', serif;
            font-size: 68px;
            font-weight: 300;
            letter-spacing: -5px;
            line-height: 1;
            color: var(--navy);
        }

        .temp-unit {
            font-size: 15px;
            font-weight: 300;
            color: var(--soft);
            margin-bottom: 6px;
        }

        .temp-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 13px 4px 9px;
            border-radius: 100px;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .temp-meta {
            font-size: 11px;
            color: var(--soft);
            letter-spacing: 0.8px;
            line-height: 2;
            border-top: 1px solid rgba(0, 0, 0, 0.06);
            padding-top: 10px;
            margin-top: 10px;
            text-transform: uppercase;
        }

        .spinner {
            width: 18px;
            height: 18px;
            margin: 18px 0 4px;
            border: 2px solid rgba(0, 0, 0, 0.08);
            border-top-color: #0ea5e9;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ── Legend panel ── */
        #legend-panel {
            top: 72px;
            right: 20px;
            width: 200px;
            padding: 18px 16px 14px;
        }

        .legend-eyebrow {
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--soft);
            margin-bottom: 12px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 8px;
            border-radius: 8px;
            margin: 2px 0;
        }

        .legend-swatch {
            width: 24px;
            height: 6px;
            border-radius: 3px;
            flex-shrink: 0;
        }

        .legend-name {
            font-size: 11px;
            font-weight: 500;
            color: var(--navy-hover);
            flex: 1;
        }

        .legend-range {
            font-size: 10px;
            color: var(--soft);
        }

        /* ── Legend toggle button (mobile only) ── */
        #legend-toggle {
            display: none;
            position: fixed;
            bottom: 24px;
            right: 16px;
            z-index: 20;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--navy-90);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-dark-2);
            color: white;
            font-size: 16px;
            cursor: pointer;
            align-items: center;
            justify-content: center;
            pointer-events: all;
            transition: all 0.2s;
        }

        #legend-toggle:hover {
            background: var(--navy-98);
        }

        /* ── Desktop ── */
        .maplibregl-ctrl-attrib {
            background: var(--on-dark) !important;
            font-size: 10px !important;
        }

        .maplibregl-ctrl-bottom-right {
            bottom: 8px;
            right: 8px;
        }

        /* ── Mobile ── */
        @media (max-width: 700px) {

            /* Fix iOS auto-zoom on search input focus */
            #search-input {
                font-size: 16px !important;
            }

            /* Search bar — full width, second row */
            #search-container {
                top: 62px;
                left: 12px;
                right: 12px;
                width: auto;
                transform: none;
            }

            /* Info panel — collapsible bottom sheet */
            #info-panel {
                position: fixed;
                top: auto;
                left: 0;
                right: 0;
                bottom: 0;
                width: 100%;
                border-radius: 20px 20px 0 0;
                border-bottom: none;
                max-height: 55vh;
                max-height: 55dvh;
                overflow-y: auto;
                -webkit-overflow-scrolling: touch;
                transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
                transform: translateY(0);
                z-index: 10;
            }

            /* Collapsed state — only handle visible */
            #info-panel.collapsed {
                transform: translateY(calc(100% - 44px));
            }

            /* Drag handle */
            #panel-handle {
                display: flex;
                justify-content: center;
                padding: 10px 0 4px;
                cursor: pointer;
                touch-action: none;
            }

            #panel-handle::before {
                content: '';
                width: 36px;
                height: 4px;
                border-radius: 2px;
                background: rgba(0, 0, 0, 0.15);
            }

            #info-content {
                padding: 8px 14px 20px;
            }

            .panel-eyebrow {
                display: none;
            }

            .panel-title {
                font-size: 15px;
            }

            .temp-value {
                font-size: 42px;
            }

            .temp-place {
                font-size: 10px;
                margin-top: 8px;
            }

            .temp-badge {
                font-size: 10px;
                padding: 3px 10px;
            }

            .temp-meta {
                font-size: 10px;
            }

            /* Wave + GYG compact */
            .panel-waves {
                gap: 4px;
                margin-top: 8px;
                padding-top: 8px;
            }

            .panel-wave-value {
                font-size: 13px;
            }

            .panel-wave-label {
                font-size: 8px;
            }

            .panel-wave-state {
                font-size: 9px;
            }

            /* Map controls above collapsed panel handle */
            .maplibregl-ctrl-bottom-right {
                bottom: 52px;
                right: 8px;
            }

            /* Legend panel — hidden on mobile (inline version used instead) */
            #legend-panel {
                display: none !important;
            }

            #legend-toggle {
                display: none;
            }
        }


        /* Scale button — mobile only */
        .legend-scale-btn {
            display: none;
        }

        @media (max-width: 700px) {
            .legend-scale-btn {
                display: inline-flex;
            }
        }

        /* ── Wave conditions in panel ── */
        .panel-waves {
            margin-top: 10px;
            padding: 10px 0 0;
            border-top: 1px solid rgba(0, 0, 0, 0.06);
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .panel-wave-stat {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .panel-wave-value {
            font-family: 'DM Mono', monospace;
            font-size: 15px;
            font-weight: 400;
            color: var(--navy);
            letter-spacing: -0.3px;
        }

        .panel-wave-label {
            font-size: 10px;
            color: var(--navy);
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .panel-wave-state {
            font-size: 11px;
            color: var(--navy);
            font-weight: 500;
            margin-top: 6px;
            letter-spacing: 0.3px;
            grid-column: 1 / -1;
        }

        /* ── Nearby beaches button (inside info panel) ── */
        /* ── Info panel tabs ── */
        .info-tabs {
            display: flex;
            gap: 0;
            margin-top: 14px;
            background: rgba(0, 0, 0, 0.04);
            border-radius: 10px;
            padding: 3px;
        }

        .info-tab {
            flex: 1;
            padding: 7px 4px;
            border: none;
            background: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'DM Mono', monospace;
            font-size: 9px;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            color: var(--navy);
            opacity: 0.45;
            transition: all 0.15s;
            font-weight: 600;
            white-space: nowrap;
        }

        .info-tab.active {
            background: var(--navy);
            color: #ffffff;
            opacity: 1;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15);
        }

        .info-tab:hover:not(.active) {
            opacity: 0.75;
        }

        .info-tab-content {
            display: none;
            margin-top: 0;
        }

        .info-tab-content.active {
            display: block;
        }

        .nearby-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 8px;
            padding: 10px 14px;
            background: rgba(0, 0, 0, 0.03);
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 12px;
            cursor: pointer;
            font-size: 10px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--soft);
            font-family: 'DM Mono', monospace;
            transition: all 0.2s;
            width: 100%;
        }

        .nearby-btn:hover {
            background: rgba(56, 189, 248, 0.06);
            border-color: rgba(56, 189, 248, 0.2);
            color: var(--link);
        }

        /* ── Nearby beaches overlay ── */
        #nearby-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 30;
            display: none;
            align-items: flex-start;
            justify-content: flex-start;
        }

        #nearby-overlay.visible {
            display: flex;
        }

        #nearby-panel {
            background: var(--glass);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 4px 40px rgba(0, 0, 0, 0.15);
            width: 480px;
            max-height: 85vh;
            max-height: 85dvh;
            overflow-y: auto;
            margin: 20px;
        }

        .nearby-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 20px 14px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
            position: sticky;
            top: 0;
            background: var(--glass);
            backdrop-filter: blur(24px);
            z-index: 1;
        }

        .nearby-header-title {
            font-family: 'Fraunces', serif;
            font-size: 18px;
            font-weight: 600;
            color: var(--navy);
        }

        .nearby-header-sub {
            font-family: 'DM Mono', monospace;
            font-size: 9px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--soft);
            margin-top: 2px;
        }

        .nearby-close {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.06);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: var(--muted);
            transition: background 0.2s;
            flex-shrink: 0;
        }

        .nearby-close:hover {
            background: rgba(0, 0, 0, 0.12);
        }

        .nearby-body {
            padding: 12px 16px 20px;
        }



        /* Beach cards */
        .nearby-beach-card {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid rgba(0, 0, 0, 0.06);
            background: rgba(0, 0, 0, 0.02);
            margin-bottom: 8px;
            text-decoration: none;
            transition: all 0.15s;
            cursor: pointer;
        }

        .nearby-beach-card:hover {
            border-color: rgba(56, 189, 248, 0.25);
            background: rgba(56, 189, 248, 0.04);
        }

        .nearby-beach-temp {
            font-family: 'Fraunces', serif;
            font-size: 28px;
            font-weight: 300;
            line-height: 1;
            letter-spacing: -1px;
            min-width: 70px;
            text-align: right;
            flex-shrink: 0;
        }

        .nearby-beach-temp-unit {
            font-size: 12px;
            font-weight: 300;
        }

        .nearby-beach-info {
            flex: 1;
            min-width: 0;
        }

        .nearby-beach-name {
            font-family: 'Fraunces', serif;
            font-size: 15px;
            font-weight: 600;
            color: var(--navy);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .nearby-beach-meta {
            font-family: 'DM Mono', monospace;
            font-size: 10px;
            color: var(--soft);
            margin-top: 3px;
            letter-spacing: 0.5px;
        }

        .nearby-beach-badge {
            font-family: 'DM Mono', monospace;
            font-size: 9px;
            font-weight: 500;
            padding: 2px 8px;
            border-radius: 99px;
            margin-top: 4px;
            display: inline-block;
            letter-spacing: 0.5px;
        }

        .beach-num-marker {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #ffffff;
            border: 2.5px solid #0ea5e9;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'DM Mono', monospace;
            font-size: 10px;
            font-weight: 700;
            color: #0d1b2a;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
            transition: transform 0.15s, box-shadow 0.15s;
            user-select: none;
        }

        .beach-num-marker.active {
            color: #ffffff;
            transform: scale(1.2);
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.3);
        }

        .nearby-beach-num {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #0d1b2a;
            color: #ffffff;
            font-family: 'DM Mono', monospace;
            font-size: 10px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .nearby-beach-card--active .nearby-beach-num {
            background: var(--accent);
        }

        .nearby-beach-card--active {
            border-color: var(--accent) !important;
            background: rgba(56, 189, 248, 0.06) !important;
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
        }

        .nearby-loading {
            text-align: center;
            padding: 32px 16px;
            font-family: 'DM Mono', monospace;
            font-size: 11px;
            color: var(--soft);
            letter-spacing: 1px;
        }

        @media (max-width: 700px) {
            #nearby-panel {
                width: 100%;
                margin: 0;
                border-radius: 20px 20px 0 0;
                max-height: 80vh;
                max-height: 80dvh;
            }

            #nearby-overlay {
                align-items: flex-end;
                justify-content: center;
            }
        }

        /* GYG link moved to forecast panel chart section */

        /* ── Accessibility ── */
        .skip-link {
            position: fixed;
            top: -100%;
            left: 1rem;
            z-index: 1000;
            padding: 8px 16px;
            background: var(--accent);
            color: var(--bg);
            font-size: 13px;
            font-weight: 500;
            border-radius: 0 0 8px 8px;
            text-decoration: none;
            transition: top 0.2s;
        }

        .skip-link:focus {
            top: 0;
        }

        :focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
            border-radius: 4px;
        }

        @media (pointer: coarse) {
            .maplibregl-ctrl-group button {
                width: 44px !important;
                height: 44px !important;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* ── Forecast overlay ── */
        #forecast-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 30;
            display: none;
            align-items: flex-end;
            justify-content: flex-start;
        }

        #forecast-overlay.visible {
            display: flex;
        }

        #forecast-panel {
            background: var(--glass);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 4px 40px rgba(0, 0, 0, 0.15);
            width: 480px;
            max-height: 85vh;
            max-height: 85dvh;
            overflow-y: auto;
            margin: 20px;
            -webkit-overflow-scrolling: touch;
        }



        .forecast-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 20px 12px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
            position: sticky;
            top: 0;
            background: var(--glass);
            backdrop-filter: blur(24px);
            z-index: 1;
        }

        .forecast-title {
            font-family: 'Fraunces', serif;
            font-size: 18px;
            font-weight: 600;
            color: var(--navy);
            letter-spacing: -0.3px;
        }

        .forecast-subtitle {
            font-size: 10px;
            color: var(--soft);
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: 2px;
        }

        .forecast-close {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.06);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: var(--muted);
            transition: background 0.2s;
            flex-shrink: 0;
        }

        .forecast-close:hover {
            background: rgba(0, 0, 0, 0.12);
        }

        .forecast-body {
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        /* ── Block 1: Forecast card ── */
        .fp-block {
            padding: 16px 20px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.07);
        }

        .fp-block-heading {
            margin-bottom: 14px;
        }

        .fp-block-heading-title {
            font-family: 'Fraunces', serif;
            font-size: 17px;
            font-weight: 600;
            color: var(--navy);
            letter-spacing: -0.2px;
            line-height: 1.1;
        }

        .fp-block-heading-sub {
            font-family: 'DM Mono', monospace;
            font-size: 10px;
            font-weight: 400;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--soft);
            margin-top: 2px;
        }

        .forecast-days {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 0;
        }

        .forecast-days--7col {
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }

        .forecast-day {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding: 12px 8px;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.03);
            border: 1px solid rgba(0, 0, 0, 0.05);
            text-align: center;
        }

        .forecast-day-name {
            font-family: 'DM Mono', monospace;
            font-size: 10px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--soft);
            font-weight: 500;
        }

        .forecast-day-temp {
            font-family: 'Fraunces', serif;
            font-size: 22px;
            font-weight: 600;
            line-height: 1;
            letter-spacing: -0.5px;
        }

        /* ── Block 2: Waves card ── */
        .forecast-table {
            display: grid;
            grid-template-columns: auto repeat(3, 1fr);
            gap: 6px;
            font-size: 11px;
        }

        .forecast-table--7col {
            grid-template-columns: auto repeat(7, 1fr);
        }

        .forecast-row-label {
            font-family: 'DM Mono', monospace;
            font-size: 10px;
            color: var(--soft);
            font-weight: 400;
            display: flex;
            align-items: center;
            padding-right: 8px;
            white-space: nowrap;
        }

        .forecast-cell {
            text-align: center;
            padding: 7px 4px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.03);
            border: 1px solid rgba(0, 0, 0, 0.05);
            color: var(--navy);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: -0.3px;
        }

        /* ── Block 3: History ── */
        .fp-history-block {
            padding: 16px 20px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.07);
        }

        /* ── Block 4: Activities CTA ── */
        .fp-cta-block {
            padding: 16px 20px 20px;
        }

        .forecast-loading {
            text-align: center;
            padding: 40px 24px;
            font-size: 11px;
            color: var(--soft);
            letter-spacing: 1px;
        }

        /* Skeleton loader */
        @keyframes skeleton-pulse {

            0%,
            100% {
                opacity: 0.4;
            }

            50% {
                opacity: 1;
            }
        }

        .skeleton-line {
            height: 12px;
            background: rgba(0, 0, 0, 0.08);
            border-radius: 6px;
            margin: 8px 0;
            animation: skeleton-pulse 1.5s ease-in-out infinite;
        }

        .skeleton-line.short {
            width: 40%;
        }

        .skeleton-line.medium {
            width: 65%;
        }

        .skeleton-line.long {
            width: 90%;
        }

        .skeleton-line.tall {
            height: 48px;
        }

        /* Loading spinner for panels */
        .panel-spinner {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            padding: 32px 0;
        }

        .panel-spinner-ring {
            width: 28px;
            height: 28px;
            border: 2.5px solid rgba(0, 0, 0, 0.08);

        .panel-spinner-text {
            font-family: 'DM Mono', monospace;
            font-size: 10px;
            letter-spacing: 1px;
            text-transform: uppercase;

        /* ── More details button ── */
        .more-details-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 14px;
            padding: 11px 16px;
            background: rgba(56, 189, 248, 0.07);
            border: 1px solid rgba(56, 189, 248, 0.18);
            border-radius: 12px;
            cursor: pointer;
            font-size: 10px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--link);
            font-family: 'DM Mono', monospace;
            transition: all 0.2s;
            width: 100%;
        }

        .more-details-btn::after {
            content: '';
            width: 16px;
            height: 16px;
            border-right: 1.5px solid var(--link);
            border-bottom: 1.5px solid var(--link);
            border-radius: 0 0 3px 0;
            transform: rotate(45deg) translate(-4px, -4px);
            flex-shrink: 0;
        }

        .more-details-btn:hover {
            background: rgba(56, 189, 248, 0.14);
            border-color: rgba(56, 189, 248, 0.35);
        }

        /* ── SST History Chart ── */
        .sst-history-section {
            margin: 0;
        }

        .sst-history-header {
            margin-bottom: 10px;
        }

        .sst-history-title {
            font-family: 'DM Mono', monospace;
            font-size: 10px;
            font-weight: 500;
            color: var(--soft);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin: 0 0 12px 0;
            display: block;
        }

        /* Dark card wrapping the canvas — matches beaches.html dark bg */
        .sst-history-chart-wrap {
            position: relative;
            background: #0d1b2a;
            border-radius: 12px;
            border: 1px solid var(--border-dark);
            padding: 12px 12px 8px;
            cursor: crosshair;
        }

        .sst-history-chart-wrap canvas {
            width: 100%;
            display: block;
        }

        /* Floating tooltip above hovered dot */
        .sst-history-tooltip {
            position: absolute;
            pointer-events: none;
            display: none;
            background: #0d1b2a;
            color: #e2e8f0;
            font-family: 'DM Mono', monospace;
            font-size: 11px;
            line-height: 1.4;
            padding: 5px 9px;
            border-radius: 6px;
            white-space: nowrap;
            border: 1px solid var(--border-dark-2);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
            z-index: 10;
            transform: translateX(-50%);
        }

        .sst-history-tooltip::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border: 5px solid transparent;
            border-top-color: var(--border-dark-2);
        }

        .sst-history-gyg a,
        .sst-history-gyg a:link,
        .sst-history-gyg a:visited,
        .sst-history-gyg a:hover,
        .sst-history-gyg a:active {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            border-radius: 14px;
            padding: 16px 18px;
            text-decoration: none;
            color: #ffffff !important;
            font-family: 'DM Mono', monospace;
            font-size: 12px;
            line-height: 1.5;
        }

        .sst-history-gyg a,
        .sst-history-gyg a:link,
        .sst-history-gyg a:visited {
            background: #0d1b2a;
        }

        .sst-history-gyg a:hover,
        .sst-history-gyg a:active {
            background: #162638;
        }

        .sst-history-gyg a::after {
            content: '→';
            font-size: 18px;
            color: #38bdf8;
            flex-shrink: 0;
        }

        .sst-history-gyg-label {
            display: block;
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--on-dark-2);
            margin-bottom: 4px;
        }

        .sst-history-source {
            font-size: 9px;
            color: var(--soft);
            letter-spacing: 0.3px;
            margin-top: 8px;
        }

        @keyframes sst-pulse {

            0%,
            100% {
                opacity: 0.4;
            }

            50% {
                opacity: 1;
            }
        }

        /* Mobile forecast */
        @media (max-width: 700px) {
            #forecast-panel {
                width: 100%;
                margin: 0;
                border-radius: 20px 20px 0 0;
                max-height: 80vh;
                max-height: 80dvh;
            }

            #forecast-overlay {
                align-items: flex-end;
                justify-content: center;
            }

            /* ── Mobile forecast cards: horizontal rows, not tiny columns ── */
            .forecast-days {
                display: flex;
                flex-direction: column;
                gap: 6px;
            }

            .forecast-day {
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
                padding: 14px 16px;
                border-radius: 12px;
                text-align: left;
                gap: 0;
            }

            .forecast-day-name {
                font-size: 11px;
                letter-spacing: 1px;
                min-width: 100px;
            }

            .forecast-day-temp {
                font-size: 26px;
                letter-spacing: -0.5px;
            }

            /* ── Mobile conditions table: tighten ── */
            .forecast-table {
                gap: 4px;
            }

            .forecast-cell {
                font-size: 12px;
                padding: 8px 4px;
            }

            .forecast-row-label {
                font-size: 11px;
            }

            /* ── Mobile block padding ── */
            .fp-block {
                padding: 14px 16px;
            }

            .fp-history-block {
                padding: 14px 16px;
            }

            .fp-cta-block {
                padding: 14px 16px 20px;
            }

            /* ── Mobile block heading ── */
            .fp-block-heading-title {
                font-size: 20px;
            }

            .fp-block-heading-sub {
                font-size: 9px;
            }

            /* ── Mobile info tabs: same paradigm as the beaches page ── */
            .info-tabs {
                gap: 2px;
                padding: 3px;
                width: 100%;
            }

            .info-tab {
                flex: 1;
                font-size: 9px;
                padding: 11px 2px;
                letter-spacing: 0;
                white-space: nowrap;
                -webkit-tap-highlight-color: transparent;
            }

            /* Panel wide state does nothing on mobile — already full width */
            #info-panel.wide {
                width: 100%;
            }

            /* Forecast on mobile — same 3-column day grid as desktop,
               aligned with the metric columns below; just compacted */
            .forecast-days.forecast-days--3col {
                gap: 6px;
            }

            .forecast-days.forecast-days--3col .forecast-day {
                padding: 10px 4px;
            }

            .forecast-days.forecast-days--3col .forecast-day-name {
                font-size: 9px;
                letter-spacing: 0.5px;
            }

            .forecast-days.forecast-days--3col .forecast-day-temp {
                font-size: 22px;
            }

            /* Forecast table on mobile — ensure 3rd column visible */
            .forecast-table.forecast-table--3col {
                grid-template-columns: auto repeat(3, 1fr);
                font-size: 11px;
            }
        }
    </style>
</head>

<body>
    <a href="#info-panel" class="skip-link">Skip to temperature panel</a>

    <div id="map" role="application"
        aria-label="Interactive ocean temperature map. Click on open water to check sea temperature."></div>

    <!-- Top navigation -->
    <nav id="map-nav" aria-label="Site navigation">
        <a href="/" class="nav-pill nav-pill-brand"><span aria-hidden="true">←</span> SwimTemp</a>
        <a href="/beaches" class="nav-pill nav-pill-link">Beaches</a>
    </nav>

    <!-- Search bar -->
    <div id="search-container">
        <div id="search-wrap">
            <input id="search-input" type="text" placeholder="Search any beach or city..." autocomplete="off"
                aria-label="Search for a beach or location" />
            <span id="search-icon">⌕</span>
            <div id="search-results" role="listbox" aria-label="Search suggestions"></div>
        </div>
    </div>

    <!-- Info panel -->
    <section class="panel" id="info-panel" aria-label="Temperature information">
        <div id="panel-handle" role="button" aria-label="Toggle panel" tabindex="0"></div>
        <div id="info-color-bar" aria-hidden="true"></div>
        <div id="info-content">
            <div class="panel-eyebrow">Ocean conditions</div>
            <div class="panel-title">Sea Conditions</div>
            <!-- Hero — always visible -->
            <div id="info-hero"></div>
            <!-- GYG — always visible, between hero and tabs -->
            <div id="info-gyg-permanent" style="display:none;margin-top:40px"></div>
            <!-- Tabs -->
            <div class="info-tabs" id="info-tabs" style="display:none;margin-top:40px">
                <button class="info-tab active" onclick="showInfoTab('today')">Today</button>
                <button class="info-tab" onclick="showInfoTab('forecast')">Forecast</button>
                <button class="info-tab" onclick="showInfoTab('history')">History</button>
                <button class="info-tab" onclick="showInfoTab('beaches')">Beaches</button>
            </div>
            <!-- Tab content -->
            <div id="info-body" aria-live="polite" aria-atomic="true" style="margin-top:40px">
                <p class="info-placeholder">Click anywhere on the ocean to check the water temperature.</p>
            </div>
        </div>
    </section>

    <!-- Legend panel -->
    <section class="panel" id="legend-panel" aria-label="Temperature scale legend">
        <div class="legend-eyebrow">Water temperature</div>
        <div id="legend-items"></div>
    </section>

    <!-- Legend toggle (mobile only) -->
    <button id="legend-toggle" aria-label="Toggle temperature legend">🌡</button>


    <!-- Nearby beaches overlay -->
    <div id="nearby-overlay" role="dialog" aria-label="Beaches nearby" aria-modal="true">
        <div id="nearby-panel">
            <div class="nearby-header">
                <div>
                    <div class="nearby-header-title" id="nearby-title">Beaches nearby</div>
                    <div class="nearby-header-sub" id="nearby-sub">Loading...</div>
                </div>
                <button class="nearby-close" id="nearby-close" aria-label="Close">✕</button>
            </div>
            <div class="nearby-body">

                <div id="nearby-content">
                    <div class="nearby-loading">Loading beaches...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Forecast overlay -->
    <div id="forecast-overlay" role="dialog" aria-label="7-day ocean forecast" aria-modal="true">
        <div id="forecast-panel">
            <div class="forecast-header">
                <div>
                    <div class="forecast-title" id="forecast-place">Ocean Forecast</div>
                    <div id="forecast-coords" style="font-family:'DM Mono',monospace;font-size:10px;
                         color:var(--text-panel-muted);letter-spacing:1px;margin-top:3px"></div>
                </div>
                <button class="forecast-close" id="forecast-close" aria-label="Close forecast">✕</button>
            </div>
            <div class="forecast-body" id="forecast-body">
                <div class="forecast-loading">Loading forecast...</div>
            </div>
        </div>
    </div>

    <script>
        // ── Legend toggle ─────────────────────────────────────────────────────────────
        document.getElementById('legend-toggle').addEventListener('click', () => {
            document.getElementById('legend-panel').classList.toggle('visible');
        });

        const BANDS = [
            { id: 'cold', label: 'Cold', range: '< 17°C', color: '#2563eb', emoji: '🥶', min: -99, max: 17 },
            { id: 'brave', label: 'Brave', range: '17–20°C', color: '#0ea5e9', emoji: '🤿', min: 17, max: 20 },
            { id: 'nice', label: 'Nice', range: '20–23°C', color: '#22c55e', emoji: '😊', min: 20, max: 23 },
            { id: 'perfect', label: 'Perfect', range: '23–26°C', color: '#f59e0b', emoji: '🏊', min: 23, max: 26 },
            { id: 'very_warm', label: 'Very Warm', range: '> 26°C', color: '#ef4444', emoji: '🔥', min: 26, max: 999 },
        ];

        function getBand(t) {
            return BANDS.find(b => t >= b.min && t < b.max) || BANDS[BANDS.length - 1];
        }

        // ── Reverse geocoding ─────────────────────────────────────────────────────────
        async function getPlaceName(lat, lon) {
            try {
                // Strategy: reverse geocode first, then if we only get a country,
                // do a nearby city search to get something precise.
                const reverseRes = await fetch(
                    `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json&zoom=14&addressdetails=1`,
                    { headers: { 'Accept-Language': 'en' } }
                );
                if (!reverseRes.ok) return null;
                const d = await reverseRes.json();
                const a = d.address || {};

                // Named body of water — use it directly
                if (a.sea) return a.sea;
                if (a.ocean) return a.ocean;
                if (a.bay) return a.bay + (a.country ? ', ' + a.country : '');
                if (a.gulf) return a.gulf + (a.country ? ', ' + a.country : '');

                const city = a.city || a.town || a.village || a.municipality || '';
                const county = a.county || a.state_district || '';
                const state = a.state || '';
                const country = a.country || '';

                // If we got a precise city, use it
                if (city) {
                    const parts = [city, state, country].filter(Boolean);
                    const unique = parts.filter((p, i) => p !== parts[i - 1]);
                    return unique.slice(0, 3).join(', ');
                }

                // Only got country — search for nearest town/city in a wider box
                if (country) {
                    try {
                        // Search for place types near the coordinate (1° box)
                        const nearbyRes = await fetch(
                            `https://nominatim.openstreetmap.org/search?format=json&limit=5&addressdetails=1` +
                            `&viewbox=${(lon - 1).toFixed(3)},${(lat + 1).toFixed(3)},${(lon + 1).toFixed(3)},${(lat - 1).toFixed(3)}` +
                            `&bounded=1&q=city`,
                            { headers: { 'Accept-Language': 'en' } }
                        );
                        if (nearbyRes.ok) {
                            const nearby = await nearbyRes.json();
                            // Pick first result that has a city/town in its address
                            for (const r of nearby) {
                                const ra = r.address || {};
                                const rcity = ra.city || ra.town || ra.village || '';
                                const rstate = ra.state || '';
                                const rcountry = ra.country || '';
                                if (rcity) {
                                    return [rcity, rstate, rcountry].filter(Boolean).slice(0, 3).join(', ');
                                }
                            }
                        }
                    } catch { /* fall through */ }

                    // Last resort: use county/state + country
                    const parts = [county || state, country].filter(Boolean);
                    return parts.join(', ') || country;
                }

                return null;
            } catch { return null; }
        }

        // ── Search ────────────────────────────────────────────────────────────────────
        const searchInput = document.getElementById('search-input');
        const searchResults = document.getElementById('search-results');
        let searchTimer = null;
        let currentMarker = null;

        searchInput.addEventListener('input', () => {
            clearTimeout(searchTimer);
            const q = searchInput.value.trim();
            if (q.length < 2) { hideResults(); return; }
            searchTimer = setTimeout(() => doSearch(q), 400);
        });

        searchInput.addEventListener('keydown', e => {
            if (e.key === 'Escape') { hideResults(); searchInput.blur(); }
        });

        document.addEventListener('click', e => {
            if (!e.target.closest('#search-container')) hideResults();
        });

        function hideResults() {
            searchResults.classList.remove('visible');
            searchResults.innerHTML = '';
        }

        async function doSearch(query) {
            searchResults.innerHTML = '<div class="search-loading">Searching...</div>';
            searchResults.classList.add('visible');
            try {
                const res = await fetch(
                    `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query)}&format=json&limit=5&addressdetails=1`,
                    { headers: { 'Accept-Language': 'en' } }
                );
                const results = await res.json();
                if (results.length === 0) {
                    searchResults.innerHTML = '<div class="search-loading">No results found</div>';
                    return;
                }
                searchResults.innerHTML = results.map(r => {
                    const name = r.display_name.split(',').slice(0, 2).join(',');
                    const type = r.type || r.class || '';

        function waveStateLabel(wh) {

            if (wh >= 0.3) return '😊 Light waves';
            return '🏊 Calm — ideal for swimming';
        }

        function waveHtml(waves) {
            if (!waves) return '';

        // Builds a location + temperature aware GYG query and label

            const parts = placeName.split(',').map(p => p.trim()).filter(Boolean);

            // "Italy" → "Italy" (still show something rather than nothing)
            const city = parts[0];
            let label, query, emoji;

            if (temp >= 26) {
                label = `Snorkeling & diving tours in ${city}`;
                query = `${city} snorkeling diving`;
                emoji = '🐠';

        // Inline forecast — renders forecast blocks into #info-body
        async function loadForecastInline(lat, lon, targetEl) {
            const apiDays = FORECAST_DAYS_EXTENDED;
            const displayDays = canAccessExtendedForecast() ? FORECAST_DAYS_EXTENDED : FORECAST_DAYS_FREE;
            try {
                const [marineRes, windRes] = await Promise.all([
                    fetch(`https://marine-api.open-meteo.com/v1/marine?latitude=${lat.toFixed(4)}&longitude=${lon.toFixed(4)}&daily=wave_height_max,swell_wave_height_max,sea_surface_temperature_max&forecast_days=${apiDays}&timezone=auto`),
                    fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat.toFixed(4)}&longitude=${lon.toFixed(4)}&daily=wind_speed_10m_max,wind_direction_10m_dominant&forecast_days=${apiDays}&timezone=auto`)
                ]);
                const marine = await marineRes.json();
                const wind = await windRes.json();
                const days = (marine.daily?.time || []).slice(1, displayDays + 1);
                const sst = (marine.daily?.sea_surface_temperature_max || []).slice(1, displayDays + 1);
                const waveMax = (marine.daily?.wave_height_max || []).slice(1, displayDays + 1);
                const swellMax = (marine.daily?.swell_wave_height_max || []).slice(1, displayDays + 1);
                const windSpeed = (wind.daily?.wind_speed_10m_max || []).slice(1, displayDays + 1);
                const windDir = (wind.daily?.wind_direction_10m_dominant || []).slice(1, displayDays + 1);
                const hasSSTData = sst.some(v => v != null);
                const hasWaveData = waveMax.some(v => v != null);
                const hasWindData = windSpeed.some(v => v != null);

                (targetEl || document.getElementById('info-body')).innerHTML = `
                    <div style="margin-top:10px">
                        <div class="fp-block-heading-sub" style="margin-bottom:10px">Open-Meteo Marine · Next 3 days</div>
                        ${hasSSTData ? `<div class="forecast-days forecast-days--3col" style="margin-bottom:12px">
                            ${days.map((d, i) => {
                    const band = sst[i] != null ? getBand(sst[i]) : null;
                    return `<div class="forecast-day">
                                    <div class="forecast-day-name">${forecastDayLabel(d, i)}</div>
                                    <div class="forecast-day-temp" style="color:${band ? band.color : '#0d1b2a'}">${sst[i] != null ? sst[i].toFixed(1) + '°' : '—'}</div>
                                </div>`;
                }).join('')}
                        </div>` : '<p class="info-placeholder" style="margin:8px 0">No forecast data for this area.</p>'}
                        <div class="forecast-table forecast-table--3col" style="margin-bottom:8px">
                            ${hasWaveData ? `
                            <div class="forecast-row-label">🌊 Wave</div>
                            ${days.map((d, i) => `<div class="forecast-cell">${waveMax[i] != null ? waveMax[i].toFixed(1) + 'm' : '—'}</div>`).join('')}
                            <div class="forecast-row-label">🌬 Swell</div>
                            ${days.map((d, i) => `<div class="forecast-cell">${swellMax[i] != null ? swellMax[i].toFixed(1) + 'm' : '—'}</div>`).join('')}` : ''}
                            ${hasWindData ? `
                            <div class="forecast-row-label">💨 Wind</div>
                            ${days.map((d, i) => `<div class="forecast-cell">${windSpeed[i] != null ? Math.round(windSpeed[i]) + 'km' : '—'}</div>`).join('')}
                            <div class="forecast-row-label">⬆ Dir</div>
                            ${days.map((d, i) => `<div class="forecast-cell">${dirArrow(windDir[i])}</div>`).join('')}` : ''}
                        </div>
                    </div>`;
            } catch {
                (targetEl || document.getElementById('info-body')).innerHTML = '<p class="info-placeholder">Could not load forecast.</p>';
            }

        // Inline beaches — renders beach list into #info-body
        async function loadNearbyInline(lat, lon, targetEl) {
            const body = targetEl || document.getElementById('info-body');
            try {
                const elements = await queryOverpassBeaches(lat, lon, NEARBY_RADIUS_KM);
                if (!elements.length) {
                    body.innerHTML = '<p class="info-placeholder" style="padding:16px 0">No beaches found within ' + NEARBY_RADIUS_KM + ' km.</p>';
                    return;
                }
                const seen = new Set();
                const beaches = elements
                    .map(overpassToBeach).filter(b => b !== null)
                    .filter(b => { if (seen.has(b.name)) return false; seen.add(b.name); return true; })
                    .map(b => ({ ...b, dist: haversineKm(lat, lon, b.lat, b.lon) }))
                    .sort((a, b) => a.dist - b.dist).slice(0, 10);

                body.innerHTML = '<div class="panel-spinner"><div class="panel-spinner-ring"></div><div class="panel-spinner-text">Loading temperatures…</div></div>';

                const markerEls = [];
                const withTemp = await Promise.all(beaches.map(async b => {
                    try {
                        const res = await fetch(`/api/point?lat=${b.lat.toFixed(5)}&lon=${b.lon.toFixed(5)}&radius_km=5`);
                        const data = await res.json();
                        return { ...b, temp_c: data.status === 'ok' ? data.mean_c : null };
                    } catch { return { ...b, temp_c: null }; }
                }));

                // Warmest first — that's the question users are asking
                withTemp.sort((a, b) => (b.temp_c ?? -99) - (a.temp_c ?? -99) || a.dist - b.dist);
                const chipT = withTemp[0] && withTemp[0].temp_c != null ? withTemp[0].temp_c : null;

                body.innerHTML = '<div style="font-size:9px;letter-spacing:1px;text-transform:uppercase;color:#94a3b8;padding:2px 0 8px">Sorted warmest first</div>' + withTemp.map((b, i) => {
                    const num = i + 1;
                    const band = bandFromTemp(b.temp_c);
                    const dotColor = b.temp_c != null ? band.color : '#94a3b8';
                    const tempStr = b.temp_c != null ? b.temp_c.toFixed(1) : '—';
                    const cardId = `beach-card-${i}`;

                    const el = document.createElement('div');
                    el.className = 'beach-num-marker beach-marker-el';
                    el.textContent = num;
                    el.title = b.name;

        async function queryOverpassBeaches(lat, lon, radiusKm) {
            const radiusM = radiusKm * 1000;
            // Compact Overpass QL — single line, GET-friendly
            // OSM uses two main beach tags:
            // natural=beach  → natural sandy/rocky beach (most common, especially in Italy)
            // leisure=beach  → managed/built beach structure
            // leisure=beach_resort → beach resort with facilities
            const query = `[out:json][timeout:25];(node["natural"="beach"](around:${radiusM},${lat},${lon});way["natural"="beach"](around:${radiusM},${lat},${lon});node["leisure"="beach"](around:${radiusM},${lat},${lon});way["leisure"="beach"](around:${radiusM},${lat},${lon});node["leisure"="beach_resort"](around:${radiusM},${lat},${lon});way["leisure"="beach_resort"](around:${radiusM},${lat},${lon}););out center tags;`;

            console.log('[Overpass] Querying beaches within', radiusKm, 'km of', lat.toFixed(4), lon.toFixed(4));

            // Try multiple Overpass endpoints — some have better CORS support
            const endpoints = [
                'https://overpass-api.de/api/interpreter',
                'https://overpass.kumi.systems/api/interpreter',
            ];

            let lastErr;
            for (const endpoint of endpoints) {
                try {
                    const url = `${endpoint}?data=${encodeURIComponent(query)}`;
                    const res = await fetch(url, {
                        method: 'GET',
                        headers: { 'Accept': 'application/json' },
                    });
                    if (!res.ok) {
                        console.warn('[Overpass] HTTP', res.status, 'from', endpoint);
                        lastErr = new Error('HTTP ' + res.status);
                        continue;
                    }
                    const data = await res.json();
                    console.log('[Overpass] Found', data.elements?.length, 'elements via', endpoint);
                    return data.elements || [];
                } catch (err) {
                    console.warn('[Overpass] Failed on', endpoint, err.message);
                    lastErr = err;
                }
            }
            throw lastErr;
        }

        function overpassToBeach(el) {
            // Normalise node / way / relation into { name, lat, lon }
            const lat = el.lat ?? el.center?.lat;
            const lon = el.lon ?? el.center?.lon;
            if (!lat || !lon) return null;
            const name = el.tags?.name || el.tags?.['name:en'] || 'Unnamed Beach';
            return { name, lat, lon };
        }

        function haversineKm(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) ** 2 +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) ** 2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

            try {

                const elements = await queryOverpassBeaches(nearbyLat, nearbyLon, NEARBY_RADIUS_KM);

                console.log('[Nearby] Overpass returned', elements.length, 'elements');
                if (!elements.length) {
                    content.innerHTML = `<div class="nearby-loading">No beaches found within ${NEARBY_RADIUS_KM} km.<br>Try clicking closer to a coastline.</div>`;
                    sub.textContent = 'No results';
                    return;

                // 2. Normalise + sort by distance, deduplicate by name
                const seen = new Set();
                const beaches = elements
                    .map(overpassToBeach)
                    .filter(b => b !== null)
                    .filter(b => {
                        if (seen.has(b.name)) return false;
                        seen.add(b.name);
                        return true;
                    })
                    .map(b => ({ ...b, dist: haversineKm(nearbyLat, nearbyLon, b.lat, b.lon) }))

        async function loadForecast(lat, lon) {

            } catch (err) {
                wrap.innerHTML = `<div style="height:180px;display:flex;align-items:center;justify-content:center;">
                    <span style="font-family:'DM Mono',monospace;font-size:11px;color:#ef4444">
                        Could not load history
                    </span></div>`;
                return;
            }

            const { history, forecast } = data;
            if (!history.length) return;

            // ── Downsample history to monthly averages ────────────────────
            // Group daily points by YYYY-MM, average each month
            const byMonth = {};
            for (const pt of history) {
                const key = pt.date.slice(0, 7); // "YYYY-MM"
                if (!byMonth[key]) byMonth[key] = [];
                byMonth[key].push(pt.sst);
            }
            const monthlyHistory = Object.keys(byMonth).sort().map(key => ({
                date: key + '-15', // midpoint of month for x-positioning
                monthKey: key,
                sst: parseFloat((byMonth[key].reduce((a, b) => a + b, 0) / byMonth[key].length).toFixed(1)),
            }));

            // Forecast: keep daily but we'll show as dashed extension
            const fcPoints = forecast.slice(0, 7);

            // Build canvas
            wrap.innerHTML = '<canvas id="sstCanvas"></canvas><div class="sst-history-tooltip" id="sstTooltip"></div>';
            const canvas = document.getElementById('sstCanvas');
            const tooltip = document.getElementById('sstTooltip');
            const dpr = window.devicePixelRatio || 1;
            const W = wrap.clientWidth || 280;
            const H = 200;
            canvas.width = W * dpr;
            canvas.height = H * dpr;
            canvas.style.width = W + 'px';
            canvas.style.height = H + 'px';
            const ctx = canvas.getContext('2d');
            ctx.scale(dpr, dpr);

            const pad = { top: 28, right: 28, bottom: 34, left: 42 };
            const allSST = monthlyHistory.map(p => p.sst);
            const minSST = Math.floor(Math.min(...allSST)) - 1;
            const maxSST = Math.ceil(Math.max(...allSST)) + 1;

            // X: span from first monthly point to last forecast point
            const allDates = monthlyHistory.map(p => p.date).sort();
            const dateMin = allDates.at(0);
            const dateMax = allDates.at(-1);
            const totalMs = new Date(dateMax) - new Date(dateMin) || 1;
            const plotW = W - pad.left - pad.right;
            const plotH = H - pad.top - pad.bottom;

            const xOf = d => pad.left + (new Date(d) - new Date(dateMin)) / totalMs * plotW;
            const yOf = v => pad.top + (1 - (v - minSST) / (maxSST - minSST)) * plotH;

            // Current hovered point
            const allPoints = monthlyHistory;

            let hoveredIdx = null; // index into allPoints

            function drawChart() {
                ctx.clearRect(0, 0, W, H);

                // ── Grid lines + Y labels ──────────────────────────────────
                const step = (maxSST - minSST) <= 8 ? 1 : 2;
                for (let t = Math.ceil(minSST); t <= maxSST; t += step) {
                    const y = yOf(t);
                    ctx.strokeStyle = 'var(--border-dark)';
                    ctx.lineWidth = 1;
                    ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(pad.left + plotW, y); ctx.stroke();
                    ctx.fillStyle = 'rgba(255,255,255,0.70)';
                    ctx.font = '11px DM Mono, monospace';
                    ctx.textAlign = 'right';
                    ctx.fillText(`${t}°`, pad.left - 5, y + 3);
                }

                // ── X-axis: month labels ──────────────────────────────────
                ctx.font = '10px DM Mono, monospace';
                ctx.textAlign = 'center';
                for (const pt of monthlyHistory) {
                    const d = new Date(pt.date + 'T00:00:00Z');
                    const mo = d.toLocaleString('en', { month: 'short', timeZone: 'UTC' }).toUpperCase();
                    const x = xOf(pt.date);
                    ctx.fillStyle = 'rgba(255,255,255,0.70)';
                    ctx.fillText(mo, x, pad.top + plotH + 22);
                }



                // ── History connecting lines (band-coloured) ───────────────
                if (monthlyHistory.length > 1) {
                    for (let i = 0; i < monthlyHistory.length - 1; i++) {
                        const a = monthlyHistory[i], b = monthlyHistory[i + 1];
                        ctx.beginPath();
                        ctx.moveTo(xOf(a.date), yOf(a.sst));
                        ctx.lineTo(xOf(b.date), yOf(b.sst));
                        ctx.strokeStyle = histBandColor((a.sst + b.sst) / 2);
                        ctx.lineWidth = 2;
                        ctx.stroke();
                    }
                }


                // ── Draw all dots (history then forecast) ──────────────────
                allPoints.forEach((pt, i) => {
                    const x = xOf(pt.date), y = yOf(pt.sst);
                    const col = histBandColor(pt.sst);
                    const isHovered = hoveredIdx === i;
                    const r = isHovered ? 5 : 3.5;

                    // Glow ring on hover
                    if (isHovered) {
                        ctx.beginPath(); ctx.arc(x, y, 9, 0, Math.PI * 2);
                        ctx.fillStyle = col + '28'; ctx.fill();
                    }

                    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
                    ctx.fillStyle = isHovered ? col : '#0d1b2a';
                    ctx.strokeStyle = col;
                    ctx.lineWidth = isHovered ? 0 : 2;
                    ctx.fill();
                    if (!isHovered) ctx.stroke();

                    // Value label above hovered dot
                    if (isHovered) {
                        ctx.fillStyle = col;
                        ctx.font = 'bold 13px DM Mono, monospace';
                        ctx.textAlign = 'center';
                        ctx.fillText(`${pt.sst.toFixed(1)}°`, x, y - 11);
                    }
                });
            }

            drawChart();
            // ── Hover: snap to nearest dot across history + forecast ───────
            canvas.addEventListener('mousemove', e => {
                const rect = canvas.getBoundingClientRect();
                const mx = e.clientX - rect.left;
                let bestIdx = null, bestD = Infinity;
                allPoints.forEach((pt, i) => {
                    const d = Math.abs(xOf(pt.date) - mx);
                    if (d < bestD) { bestD = d; bestIdx = i; }
                });

                const snapThresh = plotW / allPoints.length * 1.2;
                if (bestIdx === null || bestD > snapThresh) {
                    if (hoveredIdx !== null) { hoveredIdx = null; drawChart(); }
                    tooltip.style.display = 'none';
                    return;
                }

                if (hoveredIdx !== bestIdx) { hoveredIdx = bestIdx; drawChart(); }

                const pt = allPoints[bestIdx];
                const x = xOf(pt.date);
                const y = yOf(pt.sst);
                const col = histBandColor(pt.sst);
                const dateLabel = new Date(pt.date + 'T00:00:00Z').toLocaleDateString('en', { month: 'long', year: 'numeric', timeZone: 'UTC' });

                tooltip.innerHTML =
                    `<span style="color:rgba(255,255,255,0.70);font-size:10px;letter-spacing:1px;text-transform:uppercase">${dateLabel}</span><br>` +
                    `<span style="color:${col};font-size:14px;font-weight:700">${pt.sst.toFixed(1)} °C</span>`;
                tooltip.style.display = 'block';
                const tipLeft = Math.max(44, Math.min(x, W - 64));
                tooltip.style.left = tipLeft + 'px';
                tooltip.style.top = (y - 48) + 'px';
            });

            canvas.addEventListener('mouseleave', () => {
                hoveredIdx = null;
                tooltip.style.display = 'none';
                drawChart();
            });

            // ── GYG link ──────────────────────────────────────────────────
            // ── GYG link — location + temperature aware ───────────────
            // GYG is now in the first panel (#panel-gyg) — nothing to do here
        }

        // ── Mobile bottom sheet collapse/expand ──────────────────────────────────────
        const infoPanel = document.getElementById('info-panel');
        const panelHandle = document.getElementById('panel-handle');
        let isMobile = window.innerWidth <= 700;
        let isCollapsed = false;

        function collapsePanel() {
            isCollapsed = true;
            infoPanel.classList.add('collapsed');
        }

        function expandPanel() {
            isCollapsed = false;
            infoPanel.classList.remove('collapsed');
        }

        // Toggle on handle click
        if (panelHandle) {
            panelHandle.addEventListener('click', () => {
                if (isCollapsed) expandPanel();
                else collapsePanel();
            });
        }

        // Auto-expand when temperature loads
        const origSetInfoBody = function (html) {
            document.getElementById('info-body').innerHTML = html;
            if (isMobile) expandPanel();
        };

        // Collapse panel when map is clicked (but not on panel)
        document.getElementById('map').addEventListener('click', (e) => {
            if (!e.target.closest('#info-panel') && isMobile && !isCollapsed) {
                // Don't collapse — user is clicking map to check temp
            }
        });

        // Start collapsed on mobile
        window.addEventListener('load', () => {
            isMobile = window.innerWidth <= 700;
            if (isMobile) collapsePanel();
        });

        window.addEventListener('resize', () => {
            isMobile = window.innerWidth <= 700;
            if (!isMobile) expandPanel();
        });




        // ── Deep link: /map?lat=..&lon=.. → jump there and inspect the point ─────────
        (function () {
            const p = new URLSearchParams(location.search);
            const lat = parseFloat(p.get('lat')), lon = parseFloat(p.get('lon'));
            if (!isFinite(lat) || !isFinite(lon) || Math.abs(lat) > 90 || Math.abs(lon) > 180) return;
            const go = () => {
                map.jumpTo({ center: [lon, lat], zoom: Math.max(map.getZoom(), 9) });
                map.fire('click', {
                    lngLat: new maplibregl.LngLat(lon, lat),
                    originalEvent: { target: document.body },
                });
            };
            if (map.loaded()) go(); else map.once('load', go);
        })();

    </script>
</body>

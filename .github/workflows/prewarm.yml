name: Daily prewarm

on:
  schedule:
    - cron: '0 4 * * *'  # 4am UTC every day
  workflow_dispatch:      # allows manual trigger from GitHub UI

jobs:
  prewarm:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Wake machine
        run: |
          echo "Waking machine..."
          curl -sf https://swimtemp.com/ \
            --max-time 30 --retry 10 --retry-delay 6 || true
          sleep 15
          echo "Machine is up"

      - name: Trigger prewarm
        run: |
          curl -X POST https://swimtemp.com/api/admin/prewarm \
            -H "Authorization: Bearer ${{ secrets.PREWARM_SECRET }}" \
            -f
          echo "Prewarm triggered — running in background on Fly"
          echo "Check status at https://swimtemp.com/api/status"
      - name: Validate beaches
        run: python3 tests/test_beaches.py
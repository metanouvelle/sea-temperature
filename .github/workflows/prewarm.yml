name: Daily prewarm

on:
  schedule:
    - cron: '0 4 * * *'  # 4am UTC every day
  workflow_dispatch:      # allows manual trigger from GitHub UI

jobs:
  prewarm:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Wake machine and trigger prewarm
        run: |
          echo "Waking machine..."
          curl -sf https://sea-temperature.fly.dev/ \
            --max-time 30 --retry 10 --retry-delay 6 || true
          sleep 10

          echo "Triggering prewarm..."
          curl -X POST https://sea-temperature.fly.dev/api/admin/prewarm \
            -H "Authorization: Bearer ${{ secrets.PREWARM_SECRET }}" \
            -f
          echo "Prewarm triggered OK"

      - name: Keep machine alive and wait for prewarm to complete
        run: |
          echo "Polling every 2 min (max 60 attempts = 2 hours)..."
          for i in {1..60}; do
            sleep 120

            # Ping /api/status — this also keeps the machine awake
            curl -sf https://sea-temperature.fly.dev/api/status > /tmp/status.json || echo '{}' > /tmp/status.json

            LAST_RUN=$(python3 -c "import json; d=json.load(open('/tmp/status.json')); print(d.get('prewarm',{}).get('last_run','unknown'))" 2>/dev/null || echo "unknown")
            SUCCESS=$(python3 -c "import json; d=json.load(open('/tmp/status.json')); print(d.get('prewarm',{}).get('success','false'))" 2>/dev/null || echo "false")

            echo "[$i/60] last_run=$LAST_RUN success=$SUCCESS"

            if [ "$SUCCESS" = "True" ] || [ "$SUCCESS" = "true" ]; then
              echo "Prewarm completed successfully!"
              cat /tmp/status.json | python3 -m json.tool
              exit 0
            fi
          done

          echo "Timed out after 2 hours"
          exit 1
name: Daily prewarm

on:
  schedule:
    - cron: '0 4 * * *'  # 4am UTC every day
  workflow_dispatch:      # allows manual trigger from GitHub UI

jobs:
  prewarm:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Wake machine and trigger prewarm
        run: |
          echo "Waking machine..."
          curl -sf https://sea-temperature.fly.dev/ \
            --max-time 30 --retry 10 --retry-delay 6 || true
          sleep 15

          echo "Triggering prewarm..."
          curl -X POST https://sea-temperature.fly.dev/api/admin/prewarm \
            -H "Authorization: Bearer ${{ secrets.PREWARM_SECRET }}" \
            -f
          echo "Prewarm triggered OK"

      - name: Wait for prewarm to complete
        run: |
          echo "Waiting for prewarm to finish (checking every 2 min)..."
          for i in {1..45}; do
            sleep 120
            RESPONSE=$(curl -sf https://sea-temperature.fly.dev/api/status || echo '{}')
            LAST_RUN=$(echo $RESPONSE | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('prewarm',{}).get('last_run','unknown'))" 2>/dev/null || echo "unknown")
            SUCCESS=$(echo $RESPONSE | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('prewarm',{}).get('success','false'))" 2>/dev/null || echo "false")
            echo "[$i/45] last_run=$LAST_RUN success=$SUCCESS"
            if [ "$SUCCESS" = "True" ] || [ "$SUCCESS" = "true" ]; then
              echo "Prewarm completed successfully!"
              echo "$RESPONSE" | python3 -m json.tool
              exit 0
            fi
          done
          echo "Timed out waiting for prewarm"
          exit 1
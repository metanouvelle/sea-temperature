# fly.toml app configuration file generated for sea-temperature on 2026-02-16T12:56:57+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'sea-temperature'
primary_region = 'fra'

[env]
  SST_DB_PATH = "/data/sst.sqlite"
  SST_TILES_DIR = "/data/tiles"

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

# Prewarm is handled by the nightly cron job, not by the deployment release command
[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

[mounts]
  source="data"
  destination="/data"


[processes]
  app = "uvicorn app.main:app --host 0.0.0.0 --port 8000"

[[crons]]
  schedule = "0 2 * * *"
  command = "python -m app.scripts.prewarm_tiles"
  timeout = "1h"
app = 'sea-temperature'
primary_region = 'fra'

[env]
  SST_DB_PATH = "/data/sst.sqlite"
  APP_URL = "https://swimtemp.com"

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

[mounts]
  source="data"
  destination="/data"

[processes]
  app = "uvicorn app.main:app --host 0.0.0.0 --port 8000"